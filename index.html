<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            position: relative;
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        
        /* LOGO POJOK KAN */
        .logo {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
            object-fit: cover;
            transition: transform 0.5s;
        }
        .logo:hover {
            transform: rotate(360deg);
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 60px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.5);
        }
        .nama {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 900;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px #667eea, 0 0 20px #667eea, 0 0 40px #764ba2, 0 0 80px #764ba2;
            animation: lightning 3s infinite;
        }
        @keyframes lightning {
            0%, 100% { opacity: 1; }
            5% { opacity: 0.7; }
            10% { opacity: 1; }
        }
        p { font-size: 1.3em; font-weight: 300; margin-bottom: 25px; color: #c9d1ff; }
        .status {
            font-size: 0.9em; font-weight: 600; letter-spacing: 4px;
            padding: 12px 25px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 50px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <!-- LOGO KAMU -->
    <img src="logo.jpg" alt="Logo Anthony" class="logo">

    <div class="container">
        <h1 class="nama">ANTHONY</h1>
        <p>Ini adalah website portfolio saya</p>
        <div class="status">SEDANG DALAM TAHAP PENGEMBANGAN</div>
    </div>
</body>
</html>
